<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VR Cinematics for UE 5.8: social card</title>
<link href="assets/fonts/fonts.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#060810;font-family:'Space Grotesk',system-ui,sans-serif;color:#f0f4ff}
.card{position:relative;width:1200px;height:630px;background:radial-gradient(ellipse at 12% 18%,rgba(0,212,255,.22),transparent 55%),radial-gradient(ellipse at 88% 92%,rgba(167,139,250,.24),transparent 55%),#060810;overflow:hidden}
.art{position:absolute;right:0;top:0;width:520px;height:630px;background:url(media/class/rig-orbit.jpg) center/cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%);opacity:.9}
.lb{position:absolute;right:0;left:0;height:56px;background:#000}
.txt{position:absolute;left:72px;top:96px;width:660px}
.ey{font-size:17px;font-weight:700;letter-spacing:.16em;white-space:nowrap;text-transform:uppercase;color:#00d4ff}
h1{margin-top:22px;font-size:92px;line-height:.98;font-weight:700;letter-spacing:-.02em;background:linear-gradient(130deg,#fff 30%,#bdeeff 62%,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{margin-top:26px;font-size:26px;line-height:1.35;color:rgba(240,244,255,.75);max-width:600px}
.by{position:absolute;left:72px;bottom:64px;font-size:22px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.by span{color:#f59e0b}
</style>
</head>
<body><div class="card"><div class="art"></div><div class="txt"><div class="ey">Live class · Wed Oct 28, 2026</div><h1>VR Cinematics<br>for UE 5.8</h1><p>Record it in VR. Re-shoot it from anywhere. Render it once.</p></div><div class="by">Alex Coulombe <span>Presents</span></div></div></body>
</html>
