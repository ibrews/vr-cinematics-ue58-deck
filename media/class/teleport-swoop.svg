<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840"><rect width="1000" height="840" rx="26" fill="#0b0f1e" stroke="#2a3150" stroke-width="2"/><text x="44" y="82" font-family="'Space Grotesk',system-ui,Segoe UI,sans-serif" font-size="42" font-weight="700" fill="#f0f4ff">Filter across a jump</text><text x="44" y="132" font-family="'Space Grotesk',system-ui,Segoe UI,sans-serif" font-size="42" font-weight="700" fill="#f0f4ff">and the camera swoops</text><line x1="500" y1="190" x2="500" y2="560" stroke="#f43f5e" stroke-width="4" stroke-dasharray="12 9"/><text x="516" y="226" font-family="'Space Grotesk',system-ui,Segoe UI,sans-serif" font-size="34" fill="#f43f5e">teleport</text><path d="M60 500 L500 500" stroke="#f59e0b" stroke-width="9" fill="none"/><path d="M500 300 L940 300" stroke="#f59e0b" stroke-width="9" fill="none"/><path d="M60 500 L330 500 C410 500 440 450 500 400 C560 350 590 300 670 300 L940 300" stroke="#f43f5e" stroke-width="7" fill="none" stroke-dasharray="4 12"/><text x="60" y="560" font-family="'Space Grotesk',system-ui,Segoe UI,sans-serif" font-size="32" fill="#f59e0b">true path</text><text x="44" y="660" font-family="'Space Grotesk',system-ui,Segoe UI,sans-serif" font-size="36" fill="#f43f5e">Across the jump: drifts 10 frames early</text><text x="44" y="716" font-family="'Space Grotesk',system-ui,Segoe UI,sans-serif" font-size="36" fill="#00d4ff">Per segment, then cut on it: clean</text><text x="44" y="790" font-family="'Space Grotesk',system-ui,Segoe UI,sans-serif" font-size="32" fill="#9aa2bd">&gt; 30 cm off vs &lt; 3 cm (class take)</text></svg>